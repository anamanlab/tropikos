  <rect width="842" height="595" fill="#FFFFFF"/>
  
    <!-- Top Hairline Rule -->
    <line x1="48" y1="44" x2="794" y2="44" stroke="#191919" stroke-width="0.5"/>
    <text x="48" y="34" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#191919" letter-spacing="2">TRÓPIKOS ARQUITETOS</text>
    <text x="794" y="34" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="end" fill="#6B6B6B" letter-spacing="1.5">01 · CONCEITO &amp; ANATOMIA DO GRID</text>
    
    <!-- Bottom Hairline Rule -->
    <line x1="48" y1="550" x2="794" y2="550" stroke="#191919" stroke-width="0.5"/>
    <text x="48" y="568" font-family="'TWK Everett Mono', 'JetBrains Mono', monospace" font-size="8" fill="#6B6B6B" letter-spacing="0.5">RECIFE · PE · 08°03′S 34°52′W · ARQUITETURA AUTORAL</text>
    <text x="794" y="568" font-family="'TWK Everett Mono', 'JetBrains Mono', monospace" font-size="8.5" font-weight="600" text-anchor="end" fill="#191919">02 / 07</text>
    

  <!-- Left Column: Narrative -->
  <text x="48" y="86" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#191919">A Síntese entre Rigor e Clima</text>
  <text x="48" y="112" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#191919" width="330">
    <tspan x="48" dy="0">A identidade da Trópikos Arquitetos parte da tensão produtiva</tspan>
    <tspan x="48" dy="16">entre o rigor da arquitetura moderna e a organicidade do relevo,</tspan>
    <tspan x="48" dy="16">da luz e dos ventos do litoral pernambucano.</tspan>
  </text>

  <text x="48" y="185" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#191919">A Métrica Silábica 3×3 (TRÓ · PI · KOS)</text>
  <text x="48" y="207" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#6B6B6B">
    <tspan x="48" dy="0">A distribuição das 8 letras respeita rigorosamente a métrica</tspan>
    <tspan x="48" dy="15">fonética da marca. Cada linha de letras atua como uma laje de</tspan>
    <tspan x="48" dy="15">concreto aparente, com proporções neo-grotescas robustas.</tspan>
  </text>

  <text x="48" y="275" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#3D6E60">O Pátio Topográfico Interno (9ª Célula)</text>
  <text x="48" y="297" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#6B6B6B">
    <tspan x="48" dy="0">No modernismo brasileiro, o vazio nunca é ausência: é o pátio</tspan>
    <tspan x="48" dy="15">interno, o recanto vegetal ventilado que permite à luz e à brisa</tspan>
    <tspan x="48" dy="15">atravessarem o volume edificado. As 4 curvas desenham o relevo</tspan>
    <tspan x="48" dy="15">e a drenagem natural da paisagem litorânea do Recife.</tspan>
  </text>

  <text x="48" y="380" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#BA5424">O Descritor 'ARQUITETOS'</text>
  <text x="48" y="402" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#6B6B6B">
    <tspan x="48" dy="0">Ancorado na base da composição em tom terracota terroso,</tspan>
    <tspan x="48" dy="15">com tracking aberto (15 unidades), assegurando estabilidade</tspan>
    <tspan x="48" dy="15">e clareza de categoria profissional ao estúdio.</tspan>
  </text>

