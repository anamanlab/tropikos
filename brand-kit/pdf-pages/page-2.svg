  <rect width="842" height="595" fill="#FFFFFF"/>
  
    <!-- Top Hairline Rule -->
    <line x1="50" y1="44" x2="792" y2="44" stroke="#191919" stroke-width="0.8" opacity="0.3"/>
    <text x="50" y="36" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#191919" letter-spacing="1.5">TRÓPIKOS ARQUITETOS · MANUAL DE IDENTIDADE VISUAL</text>
    <text x="792" y="36" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" text-anchor="end" fill="#6B6B6B" letter-spacing="1">01 · CONCEITO &amp; ANATOMIA DO GRID</text>
    
    <!-- Bottom Hairline Rule -->
    <line x1="50" y1="550" x2="792" y2="550" stroke="#191919" stroke-width="0.8" opacity="0.3"/>
    <text x="50" y="568" font-family="'TWK Everett Mono', 'JetBrains Mono', monospace" font-size="8" fill="#6B6B6B">RECIFE — PE · 08°03′S 34°52′W</text>
    <text x="792" y="568" font-family="'TWK Everett Mono', 'JetBrains Mono', monospace" font-size="8" text-anchor="end" fill="#191919">02 / 07</text>
    

  <!-- Left Column: The Concept Narrative -->
  <text x="50" y="85" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#191919">A Síntese entre Rigor e Clima</text>
  <text x="50" y="115" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#191919" width="340">
    <tspan x="50" dy="0">O redesign do logotipo da Trópikos Arquitetos preserva</tspan>
    <tspan x="50" dy="16">100% da identidade conceitual que fundou o escritório:</tspan>
    <tspan x="50" dy="16">a tensão produtiva entre a estrutura ortogonal da arquitetura</tspan>
    <tspan x="50" dy="16">e a organicidade do relevo, vento e luz tropical do Recife.</tspan>
  </text>

  <text x="50" y="200" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#191919">A Métrica Silábica 3×3 (TRÓ · PI · KOS)</text>
  <text x="50" y="222" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#6B6B6B">
    <tspan x="50" dy="0">A distribuição das 8 letras segue a métrica fonética do nome.</tspan>
    <tspan x="50" dy="15">Cada linha de letras atua como uma laje estrutural de concreto,</tspan>
    <tspan x="50" dy="15">com proporções puras inspiradas no modernismo brasileiro.</tspan>
  </text>

  <text x="50" y="290" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#3D6E60">O Pátio Topográfico Interno (9ª Célula)</text>
  <text x="50" y="312" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#6B6B6B">
    <tspan x="50" dy="0">A 9ª célula aberta não é um vazio acidental: é o pátio interno,</tspan>
    <tspan x="50" dy="15">o recanto vegetal ventilado que permite à luz e ao vento</tspan>
    <tspan x="50" dy="15">atravessarem o volume construído. As 4 curvas desenham o relevo</tspan>
    <tspan x="50" dy="15">e a drenagem natural da paisagem litorânea pernambucana.</tspan>
  </text>

  <!-- Right Column: Visual Diagram -->
  <rect x="440" y="75" width="352" height="440" fill="#FBFBFB" stroke="#191919" stroke-width="0.8"/>
  <text x="460" y="105" font-family="'TWK Everett', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#191919">MALHA GEOMÉTRICA &amp; NORMAS DO GRID</text>
  
